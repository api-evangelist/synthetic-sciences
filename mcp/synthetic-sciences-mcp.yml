server:
  name: synsci-delphi
  product: Delphi
  summary: Open-source, self-hosted MCP server that gives AI agents deep context through semantic search
    across code repositories, research papers, and HuggingFace datasets. Runs fully local (PostgreSQL
    + pgvector); local sentence-transformers embeddings by default with optional Gemini / OpenAI hosted
    embeddings.
  transport: stdio
  bridge:
    command: uvx
    args:
    - synsci-delphi-proxy
    env:
      SYNSC_API_KEY: your-api-key
      SYNSC_API_URL: http://localhost:8742
  http_api: http://localhost:8742
  dashboard: http://localhost:3000
  install: npx @synsci/delphi
  clients:
  - Claude Code
  - Cursor
  - Windsurf
  - Claude Desktop
  mcp_server_name: synsc-context
  profiles:
    default: code + papers + datasets tools
    atlas: adds Atlas research-graph ingestion/retrieval tools (SYNSC_MCP_PROFILE=atlas)
    all: all tool groups
