aid: synthetic-sciences
name: Synthetic Sciences
description: >-
  Synthetic Sciences is a Y Combinator-backed AI research lab building foundation models
  for scientific discovery. Its flagship product, Atlas, is an agent-first research graph
  and infrastructure layer for autonomous science: durable typed nodes (hypotheses,
  experiment plans, recorded runs, evidence, decisions) linked into a shared, forkable map
  that humans and AI agents read and write directly over a REST API and the @synsci/atlas
  CLI. Atlas bundles a Library for indexing and grounded search over repos, docs, papers,
  and datasets, a cross-provider GPU compute marketplace, GEPA-based optimization and
  refereed autoresearch, and nine agent Skills. The lab also ships two open-source
  (Apache 2.0) projects: OpenScience, a model-agnostic AI workbench that runs the full
  research loop, and Delphi, a self-hosted MCP server that gives coding agents semantic
  context over code, papers, and HuggingFace datasets.
